<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración · Elección de camisetas</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .admin-shell { padding: 28px 32px 32px; }
    .admin-login { max-width: 460px; margin: 0 auto; }
    .admin-login .field { margin-bottom: 14px; }
    .admin-login label { display:block; font-weight:750; margin-bottom:7px; }
    .admin-login input {
      width:100%; border:1px solid var(--line); border-radius:12px; padding:13px 14px; outline:none;
    }
    .admin-login input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(37,99,235,.10); }
    .admin-topbar { display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; margin-bottom:20px; }
    .admin-actions { display:flex; gap:10px; flex-wrap:wrap; }
    .admin-actions button { background:#e9efff; color:#1746a2; }
    .admin-actions .danger { background:#fee4e2; color:#b42318; }
    .admin-actions .primary-small { background:var(--accent); color:white; }
    .metrics {
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:14px;
      margin-bottom:22px;
    }
    .metric {
      border:1px solid var(--line); border-radius:16px; padding:16px; background:#f8fafc;
    }
    .metric span { display:block; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.07em; font-weight:800; }
    .metric strong { display:block; font-size:28px; margin-top:5px; }
    .filters {
      display:grid;
      grid-template-columns: 1.4fr 1fr 1fr;
      gap:12px;
      margin:18px 0;
    }
    .filters input,.filters select {
      width:100%; border:1px solid var(--line); border-radius:12px; padding:11px 12px; background:white;
    }
    .table-wrap { overflow:auto; border:1px solid var(--line); border-radius:16px; }
    table { width:100%; border-collapse:collapse; min-width:860px; background:white; }
    th,td { padding:11px 10px; border-bottom:1px solid #e6eaf0; text-align:left; }
    th { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); background:#f8fafc; position:sticky; top:0; }
    tbody tr:hover { background:#fafcff; }
    .empty { padding:24px; text-align:center; color:var(--muted); }
    .session { font-size:13px; color:var(--muted); }
    @media(max-width:820px){
      .metrics{grid-template-columns:repeat(2,1fr)}
      .filters{grid-template-columns:1fr}
      .admin-shell{padding:20px}
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="brand">
        <div class="brand-mark">📊</div>
        <div>
          <p class="eyebrow">Administración</p>
          <h1>Resultados de elección de camisetas</h1>
          <p class="subtitle">Acceso restringido al personal autorizado.</p>
        </div>
      </div>

      <section id="loginPanel" class="admin-shell">
        <div class="admin-login">
          <div class="field">
            <label for="adminEmail">Correo electrónico</label>
            <input id="adminEmail" type="email" autocomplete="username" placeholder="administrador@correo.com">
          </div>
          <div class="field">
            <label for="adminPassword">Contraseña</label>
            <input id="adminPassword" type="password" autocomplete="current-password" placeholder="Contraseña">
          </div>
          <button id="loginBtn" class="primary" type="button">Ingresar</button>
          <p id="loginMessage" class="message center" aria-live="polite"></p>
        </div>
      </section>

      <section id="dashboardPanel" class="admin-shell hidden">
        <div class="admin-topbar">
          <div>
            <strong>Panel de resultados</strong>
            <div id="sessionText" class="session"></div>
          </div>
          <div class="admin-actions">
            <button id="refreshBtn" type="button">Actualizar</button>
            <button id="exportCsvBtn" class="primary-small" type="button">Descargar CSV</button>
            <button id="logoutBtn" class="danger" type="button">Cerrar sesión</button>
          </div>
        </div>

        <div id="metrics" class="metrics"></div>

        <div class="filters">
          <input id="searchFilter" type="search" placeholder="Buscar por identificación o nombre">
          <select id="groupFilter"><option value="">Todas las secciones</option></select>
          <select id="shirtFilter">
            <option value="">Todas las camisetas</option>
            <option value="Camiseta A">Camiseta A</option>
            <option value="Camiseta B">Camiseta B</option>
            <option value="Camiseta C">Camiseta C</option>
            <option value="Camiseta D">Camiseta D</option>
          </select>
        </div>

        <p id="resultCount" class="message"></p>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Identificación</th>
                <th>Nombre</th>
                <th>Sección</th>
                <th>Camiseta</th>
                <th>Fecha y hora</th>
              </tr>
            </thead>
            <tbody id="resultsBody"></tbody>
          </table>
        </div>
      </section>
    </section>
    <p class="footnote">Versión 3.0 · Administración Firebase</p>
  </main>

  <script type="module" src="admin.js"></script>
</body>
</html>
